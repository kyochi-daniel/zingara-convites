services:
  mongo:
    build: { context: ., dockerfile: Dockerfile.mongo }
    restart: unless-stopped
    command: ["bash", "/opt/zingara/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "bash", "/opt/zingara/mongo-health.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
  mongo-init:
    build: { context: ., dockerfile: Dockerfile.mongo }
    restart: "no"
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    command: ["bash", "/opt/zingara/mongo-init.sh"]
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo_data:
  mongo_config:
  redis_data:
