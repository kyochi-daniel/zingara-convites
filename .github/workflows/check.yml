name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Prepare isolated environment
        run: pnpm worktree:setup --id zingara-ci
      - name: Start database and queue
        run: docker compose --env-file .env -f infra/compose.dev.yml up -d --wait
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check project
        run: pnpm check
      - name: Stop test services
        if: always()
        run: docker compose --env-file .env -f infra/compose.dev.yml down -v
